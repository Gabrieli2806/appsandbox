# Test build of App Sandbox for Windows x64, as an MSIX.
#
# Builds the native solution with Visual Studio 2022 + the WDK (drivers are
# test-signed by the WDK, exactly like a local dev build; App Sandbox enables
# test signing inside the guest when it installs them), then the WinUI app
# (app\AppSandbox) around it with the .NET SDK, and signs the package with a
# test certificate (packaging\msix\make-msix.ps1).
#
# Pushing to a release/** branch also publishes the package as a GitHub pre-release.
name: Windows test build

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # tools/sign/AppSandboxPackage.vcxproj runs make-release.ps1 after every
      # Release build unless $(ASB_SKIP_PACKAGE_PROJECT) is 1 (it needs the
      # owner's signing key).
      ASB_SKIP_PACKAGE_PROJECT: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # cmd, not pwsh: the driver packages' post-build steps run Windows
      # PowerShell 5, which cannot load its own modules when it inherits
      # PowerShell 7's PSModulePath.
      - name: Build the native solution (Release|x64)
        shell: cmd
        # AsbSourceRepo: the repository Settings > About links to.
        # AsbVersionRevision: every build's driver package must be newer than
        # the last (Windows does not "update" to the same DriverVer).
        run: msbuild AppSandbox.sln /t:Build /p:Configuration=Release /p:Platform=x64 /p:AsbSourceRepo=%GITHUB_REPOSITORY% /p:AsbVersionRevision=%GITHUB_RUN_NUMBER% /m /v:minimal /nologo

      - name: Check the native build
        id: native
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'bin\Release'
          $props = Get-Content Directory.Build.props -Raw
          $parts = foreach ($k in 'Major', 'Minor', 'Patch') {
            if ($props -match "<AsbVersion$k>(\d+)</AsbVersion$k>") { $matches[1] } else { '0' }
          }
          $ver = $parts -join '.'

          # What the package needs from the native build. A driver or helper
          # that was not built must stop the run, not ship a package without it.
          $required = 'appsandbox_host.dll', 'appsandbox_core.dll', 'iso-patch.exe',
                      'drivers\AppSandboxVDD.dll', 'drivers\AppSandboxVDD.inf', 'drivers\AppSandboxVDD.cat',
                      'drivers\AppSandboxVDD.cer', 'drivers\devcon.exe',
                      'drivers\AppSandboxVAD.sys', 'drivers\AppSandboxVAD.inf', 'drivers\AppSandboxVAD.cat',
                      'resources\appsandbox-agent.exe', 'resources\appsandbox-input.exe',
                      'resources\appsandbox-displays.exe', 'resources\appsandbox-clipboard.exe',
                      'resources\appsandbox-clipboard-reader.exe', 'resources\appsandbox-audio.exe'
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $bin $_)) })
          if ($missing.Count) { throw "Missing from the native build: $($missing -join ', ')" }

          "bin=$bin" >> $env:GITHUB_OUTPUT
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "name=AppSandbox-$ver.${{ github.run_number }}-test-$($env:GITHUB_SHA.Substring(0, 7))-win-x64" >> $env:GITHUB_OUTPUT

      # The app and its MSIX (self-signed test certificate;
      # Install-AppSandbox.ps1 trusts the certificate and installs).
      - name: Build the app and package the MSIX
        id: msix
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'msix'
          $version = "${{ steps.native.outputs.ver }}.${{ github.run_number }}"
          ./packaging/msix/make-msix.ps1 -Stage "${{ steps.native.outputs.bin }}" -Version $version -OutDir $out
          Get-ChildItem $out | Select-Object Name, Length
          $zip = Join-Path $env:RUNNER_TEMP "${{ steps.native.outputs.name }}-msix.zip"
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.native.outputs.name }}-msix
          path: ${{ steps.msix.outputs.zip }}

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "test-build-${{ github.run_number }}"
          $notes = @"
          **Test build** from ``${{ github.ref_name }}`` (commit ${{ github.sha }}).

          - Unzip, then in an elevated PowerShell run ``powershell -ExecutionPolicy Bypass -File .\Install-AppSandbox.ps1``. It trusts the included test certificate and installs or updates the app for the user who runs it. Exit App Sandbox first (tray icon > Quit).
          - Drivers are test-signed; App Sandbox enables test signing inside the VM when it installs them.
          - Guest components of existing Windows VMs are updated before their next start; the audio driver only changes in new VMs.
          "@
          gh release create $tag "${{ steps.msix.outputs.zip }}" --prerelease --target "${{ github.sha }}" `
            --title "Test build ${{ github.run_number }} (${{ github.ref_name }})" --notes $notes

# Build check for pull requests and branch pushes.
#
# Builds the native solution (host, guest tools, drivers) for Release x64 and
# ARM64 with Visual Studio 2022 + the WDK, the same way as
# windows-test-build.yml, and on x64 the WinUI app (app\AppSandbox) around it,
# but packages and publishes nothing. release/** branches are left out because
# windows-test-build.yml already builds them. A Linux job checks the core
# source lists and the generated MCP scripts.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Other
# runs get a group of their own, so they never wait for or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release ${{ matrix.platform }}
    runs-on: windows-2022
    timeout-minutes: 90
    # ARM64 is a cross-build on the x64 runner (Directory.Build.props turns
    # off ApiValidator for it: the x86 ApiExtractor cannot read ARM64
    # binaries). Both legs must pass.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
          - platform: ARM64
    env:
      # tools/sign/AppSandboxPackage.vcxproj runs make-release.ps1 after every
      # Release build unless $(ASB_SKIP_PACKAGE_PROJECT) is 1. MSBuild reads
      # environment variables as properties, so this skips it.
      ASB_SKIP_PACKAGE_PROJECT: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # cmd, not pwsh: the driver packages' post-build steps run Windows
      # PowerShell 5, which cannot load its own modules when it inherits
      # PowerShell 7's PSModulePath.
      - name: Build Release|${{ matrix.platform }}
        shell: cmd
        run: msbuild AppSandbox.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m /v:minimal /nologo

      - uses: actions/setup-dotnet@v4
        if: matrix.platform == 'x64'
        with:
          dotnet-version: '10.0.x'

      # The app project is x64 only. No package: that is windows-test-build.yml's job.
      - name: Build the app (Release|x64)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: dotnet build app\AppSandbox\AppSandbox.csproj -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=false -v:minimal -nologo

  lint:
    name: Source lists and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A file added to src/core must be listed in AppSandboxCore.vcxproj.
      - name: Check src/core against the project file
        run: python3 tools/check-sources.py

      # src/app_win/mcp_scripts.h is generated from mcp_scripts/*.ps1.
      - name: Check the generated MCP scripts
        run: python3 tools/gen-mcp-scripts.py --check
